services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./sqlite.db
      DATABASE_URL_SYNC: sqlite:///./sqlite.db
      MOCK_MODE: "true"
      DEBUG: "true"      
      LLM_PROVIDER: "groq"
    volumes:
      - ./backend/app:/app/app

  frontend:
    build:
      context: ./frontend
      args:
        PUBLIC_API_BASE_URL: "http://backend:8000/api"
    ports:
      - "3000:3000"
    depends_on:
      - backend
